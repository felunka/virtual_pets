default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  username: virtual_pets
  database: virtual_pets

development:
  <<: *default
  host: localhost
  password: virtual_pets

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: virtual_pets_test

production:
  primary:
    <<: *default
    host: <%= ENV['POSTGRES_HOSTNAME'] %>
    password: <%= ENV['POSTGRES_PASSWORD'] %>
  cable:
    <<: *default
    host: <%= ENV['POSTGRES_HOSTNAME'] %>
    password: <%= ENV['POSTGRES_PASSWORD'] %>
  queue:
    <<: *default
    host: <%= ENV['POSTGRES_HOSTNAME'] %>
    password: <%= ENV['POSTGRES_PASSWORD'] %>
  cache:
    <<: *default
    host: <%= ENV['POSTGRES_HOSTNAME'] %>
    password: <%= ENV['POSTGRES_PASSWORD'] %>
